[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magistry-sim"
version = "0.1.0"
description = "AI + DAO governance simulation sandbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "networkx>=3.0",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = [
  "openai>=1.0",
]
viz = [
  "matplotlib>=3.8",
]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "matplotlib>=3.8",
]
all = [
  "magistry-sim[llm,viz,web,dev]",
]

[project.scripts]
magistry-sim = "magistry_sim.cli:main"
magistry-web = "magistry_sim.web:serve"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
magistry_sim = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"