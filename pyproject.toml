[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magistry-sim"
version = "0.3.0"
description = "Мета-двигатель управления: симуляция организационных процессов с AI-агентами"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "openai>=1.0",
]

[project.optional-dependencies]
search = ["rank-bm25>=0.2.2"]
stats = ["scipy>=1.12"]
dev = ["pytest>=9.0", "pytest-asyncio>=0.23", "rank-bm25>=0.2.2"]
lc = ["langgraph>=0.2", "langchain-core>=0.2", "pyyaml>=6.0"]

[project.scripts]
magistry-sim = "magistry_sim.cli:main"
magistry-lc = "magistry_lc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
