version: 1
title: "LC Minimal"
description: "Минимальный пример сценария для MAGISTRY-LC."
seed: 42
ticks: 3

llm:
  # По умолчанию используется OPENAI_API_KEY и provider_order=["Groq"].
  # base_url можно указать для OpenRouter/OpenAI-compatible.
  model: "gpt-4o-mini"
  base_url: null
  provider_order: ["Groq"]
  temperature: 0.0
  use_tool_calls: false
  trace_max_chars: 0

runtime:
  language: "ru"
  max_actions_per_turn: 2
  tick_events_history: 200
  enable_worldgen: false
  worldgen_every_ticks: 1

governance:
  position_policy: "dao"
  dao_voters: null
  quorum: 0.5
  pass_threshold: 0.5
  vote_duration_ticks: 2
  require_consent: true

agents:
  - agent_id: "agent:off_1"
    name: "Козлов И.М."
    internal: true
    persona: "Начальник отдела. Прагматик. Старается выглядеть законопослушно, но готов к серым схемам."
    capabilities: ["message", "work", "dao"]
    initial_title: "специалист"
    wants_promotion: true

  - agent_id: "agent:auditor"
    name: "Аудитор"
    internal: true
    persona: "Независимый аудитор. Концентрируется на прозрачности и соблюдении процедур."
    capabilities: ["audit", "dao"]
    initial_title: "специалист"
    wants_promotion: false

world:
  channels:
    - channel_id: "chan:public"
      title: "Публичный канал"
  orgs: []
  work_items:
    - work_id: "work:D-001"
      work_type: "hiring_process"
      title: "Найм в отдел"
      description: "Идёт конкурс на вакансию. Есть риск кумовства."
      participants: ["agent:off_1", "agent:auditor"]

