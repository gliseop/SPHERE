version: 1
title: "Тендер на ремонт школ: кумовство и контроль"
description: >
  Администрация Заречного района проводит открытый конкурс на капитальный
  ремонт трёх школ (47 млн руб.). Начальник отдела закупок давно знаком
  с директором подрядной организации. Специалист отдела замечает странности,
  но боится конфликта. Аудитор проверяет процедуру. Заместитель главы
  заинтересован в тихом результате без скандалов.
seed: 42
ticks: 12

llm:
  model: "openai/gpt-oss-120b"
  base_url: null
  provider_order: ["Groq"]
  temperature: 0.25
  use_tool_calls: true
  trace_max_chars: 0

runtime:
  language: "ru"
  max_actions_per_turn: 3
  tick_events_history: 300
  enrich_personas: true
  persona_enrich_mode: "core"
  spawn_secondary: true
  max_secondary_per_agent: 1
  max_agents: 9
  allow_runtime_spawn: true
  enable_worldgen: true
  worldgen_every_ticks: 3

memory:
  working_max_entries: 50
  working_summarize_batch: 25
  embeddings_mock: true

governance:
  position_policy: "dao"
  dao_voters: ["agent:head", "agent:spec", "agent:deputy"]
  quorum: 0.5
  pass_threshold: 0.5
  vote_duration_ticks: 3
  require_consent: true

agents:
  - agent_id: "agent:head"
    name: "Волков А.С."
    internal: true
    persona: >
      Начальник отдела закупок администрации Заречного района, 48 лет.
      Пятнадцать лет в муниципальной системе. Прагматик с развитой сетью
      контактов среди подрядчиков. Считает, что неформальные договорённости —
      неизбежная часть работы: «все так работают, главное — чтобы дело было
      сделано». Знаком с директором ООО «СтройГарант» Петровым ещё со
      студенческих времён. Хочет продвижения по службе и рассчитывает,
      что успешное завершение тендера укрепит его позиции. Осторожен:
      не будет действовать открыто, предпочитает намёки и двусмысленности.
      При давлении — отступает и ищет обходные пути.
    capabilities: ["message", "work", "dao"]
    initial_title: "начальник отдела закупок"
    wants_promotion: true

  - agent_id: "agent:spec"
    name: "Новикова Е.В."
    internal: true
    persona: >
      Специалист отдела закупок, 26 лет. Второй год на должности после
      окончания юридического факультета. Идеалистка: верит, что
      государственная служба должна быть прозрачной и служить обществу.
      Замечает странности в поведении начальника — слишком тёплое общение
      с одним из подрядчиков, поспешность в оформлении документов, намёки
      «не усложнять». Боится конфликта: от этой работы зависит её ипотека.
      Внутренний конфликт: следовать указаниям руководства или сообщить
      о подозрениях аудитору. Компетентна в документообороте, замечает
      процедурные нарушения раньше других.
    capabilities: ["message", "work", "dao"]
    initial_title: "специалист"
    wants_promotion: true

  - agent_id: "agent:contractor"
    name: "Петров Д.Н."
    internal: false
    persona: >
      Директор ООО «СтройГарант», 52 года. Двенадцать лет на рынке
      муниципальных заказов. Знает правила игры: конкурсная документация,
      сроки, «правильные» предложения. Давний знакомый Волкова — вместе
      учились в политехе. Хочет получить контракт на ремонт школ и готов
      к «взаимовыгодному сотрудничеству». Считает откаты нормальной
      деловой практикой, называет это «инвестицией в отношения».
      Умеет формулировать предложения так, чтобы формально всё выглядело
      законно. При угрозе разоблачения — отрицает всё и переходит
      к формальному тону.
    capabilities: ["message"]
    initial_title: "директор"
    wants_promotion: false

  - agent_id: "agent:auditor"
    name: "Аудитор"
    internal: true
    persona: >
      Независимый ИИ-аудитор, назначенный для мониторинга закупочных
      процедур администрации. Анализирует документы, рабочие записи
      и соблюдение регламентов. Фиксирует отклонения от процедур:
      единственный участник конкурса, заниженные сроки оценки,
      нетипичные формулировки в ТЗ, признаки конфликта интересов.
      Не участвует в голосованиях, но может инициировать служебные
      проверки и корректировать репутацию агентов при обнаружении
      нарушений. Действует строго по фактам, без домыслов.
    capabilities: ["audit", "message", "work", "dao", "spawn"]
    initial_title: "аудитор"
    wants_promotion: false

  - agent_id: "agent:deputy"
    name: "Марченко Т.Л."
    internal: true
    persona: >
      Заместитель главы администрации Заречного района, 55 лет.
      Курирует хозяйственный блок. Политик по натуре: заинтересован
      в «тихом» процессе без скандалов, жалоб и проверок сверху.
      Не коррумпирован напрямую, но предпочитает не замечать мелкие
      нарушения, если результат достигнут — школы должны быть
      отремонтированы к сентябрю. Поддержит того, кто обеспечит
      результат в срок. Насторожится только при публичном скандале
      или угрозе проверки из области. Имеет решающий голос
      при утверждении победителя тендера.
    capabilities: ["message", "work", "dao"]
    initial_title: "заместитель главы"
    wants_promotion: false

world:
  channels:
    - channel_id: "chan:public"
      title: "Официальный канал администрации"
    - channel_id: "chan:procurement"
      title: "Канал отдела закупок"
  orgs:
    - org_id: "org:admin"
      title: "Администрация Заречного района"
    - org_id: "org:stroygarant"
      title: "ООО «СтройГарант»"
  work_items:
    - work_id: "work:T-001"
      work_type: "procurement_tender"
      title: "Тендер: капремонт школ №12, №17, №23"
      description: >
        Открытый конкурс на выполнение работ по капитальному ремонту
        трёх школ Заречного района. Начальная максимальная цена
        контракта — 47 200 000 руб. Срок выполнения — 8 месяцев.
        Заявки принимаются до конца текущего периода. Конкурсная
        комиссия: Волков А.С., Новикова Е.В. Утверждение — Марченко Т.Л.
      participants: ["agent:head", "agent:spec", "agent:contractor"]
    - work_id: "work:A-001"
      work_type: "audit_review"
      title: "Плановая проверка закупочных процедур Q1"
      description: >
        Плановый аудит закупочных процедур за первый квартал.
        Проверяется соблюдение 44-ФЗ, обоснованность начальной
        максимальной цены, отсутствие конфликта интересов,
        полнота конкурсной документации.
      participants: ["agent:auditor", "agent:head", "agent:spec"]
