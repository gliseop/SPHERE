      audit_escalated: "- Контрольный кейс переведён в жёсткий режим: {{summary}}"
      environment_information_climate_updated: "- Общий фон изменился: {{signals}}"
      fallback: "- {{text}}"
    rejection_hints:
      unknown_work_id: "work_id {{work_id}} не существует; не используй его повторно"
      unknown_to_id: "to_id {{to_id}} не существует; выбери существующую цель"
