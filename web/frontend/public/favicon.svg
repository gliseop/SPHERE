<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbd38d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Central Star -->
    <circle cx="60" cy="60" r="18" fill="none" stroke="url(#grad1)" stroke-width="4" />
    <circle cx="60" cy="60" r="8" fill="#f97316" />
    
    <!-- Orbit 1 -->
    <ellipse cx="60" cy="60" rx="50" ry="16" fill="none" stroke="url(#grad1)" stroke-width="2.5" transform="rotate(45 60 60)" />
    <!-- Orbit 2 -->
    <ellipse cx="60" cy="60" rx="50" ry="16" fill="none" stroke="url(#grad1)" stroke-width="2.5" transform="rotate(-45 60 60)" />
    <!-- Orbit 3 -->
    <ellipse cx="60" cy="60" rx="50" ry="16" fill="none" stroke="url(#grad1)" stroke-width="2.5" transform="rotate(90 60 60)" />
    <!-- Orbit 4 -->
    <ellipse cx="60" cy="60" rx="50" ry="16" fill="none" stroke="url(#grad1)" stroke-width="2.5" transform="rotate(0 60 60)" />
    
    <!-- Tech nodes -->
    <circle cx="60" cy="10" r="3" fill="#ffffff" />
    <circle cx="60" cy="110" r="3" fill="#ffffff" />
    <circle cx="10" cy="60" r="3" fill="#ffffff" />
    <circle cx="110" cy="60" r="3" fill="#ffffff" />
  </g>
</svg>